# ============================================================
#  Site settings
# ============================================================
title: "Jane Q. Researcher"
description: "Personal academic homepage of Jane Q. Researcher."

# Public URL of the deployed site.
url: "https://zhengyinghit.github.io"
baseurl: ""
lang: "en"

sass:
  style: compressed

# Plugins. jekyll-scholar parses and renders the BibTeX files in _bibliography/.
plugins:
  - jekyll/scholar

# Files/directories excluded from the built site.
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
  - .github/
  - .gitignore
  - .home/
  - .gems/

# ============================================================
#  Content collections (single-page site; listed inline, not output)
# ============================================================
collections:
  news:
    output: false
  service:
    output: false

# ============================================================
#  Header navigation — in-page anchors on the single page.
# ============================================================
navigation:
  - title: About
    url: "#about"
  - title: News
    url: "#news"
  - title: Publications
    url: "#publications"
  - title: Service
    url: "#service"

# ============================================================
#  jekyll-scholar — BibTeX bibliography settings.
#  Put your BibTeX entries in _bibliography/references.bib
# ============================================================
scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: references.bib
  sort_by: year, month
  order: descending
  group_by: none
  bibliography_template: bib
  reference_tagname: span
  # Convert LaTeX markup in BibTeX fields to Unicode/HTML before display.
  bibtex_filters: [ smallcaps, superscript, italics, textit, lowercase, textregistered, tiny, latex ]
  # Display-only fields removed from the "Copy BibTeX" output.
  bibtex_skip_fields: [ abstract, month_numeric, award, pdf, arxiv, code, website, slides, poster, video, supplement ]

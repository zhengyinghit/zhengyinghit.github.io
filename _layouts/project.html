---
layout: default
---
<article class="container page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.status %}<span class="badge badge--{{ page.status | slugify }}">{{ page.status }}</span>{% endif %}
    {% if page.tagline %}<p class="page-subtitle">{{ page.tagline }}</p>{% endif %}
  </header>

  {% if page.image %}<figure class="project-figure"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"></figure>{% endif %}

  {% if page.links %}
  <div class="project-links project-links--page">
    {% for l in page.links %}<a class="pill" href="{{ l.url | relative_url }}"{% if l.url contains '://' %} target="_blank" rel="noopener"{% endif %}>{{ l.label }}</a>{% endfor %}
  </div>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/projects/' | relative_url }}">&larr; All projects</a></p>
</article>
